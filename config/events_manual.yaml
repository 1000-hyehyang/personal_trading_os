notes:
  - 이 파일은 자동 뉴스 수집을 대체하지 않는다.
  - 자동 이벤트 캘린더가 놓친 항목을 사용자가 수동으로 보정하는 용도다.
  - 실제 일정은 실행 전 BLS, Fed, 기업 IR, Alpha Vantage, TradingView 등으로 재확인한다.
  - time_et는 가능한 경우 미국 동부시간 기준으로 입력한다.
  - 날짜가 불확실한 이벤트는 impact를 medium 이하로 두고 note에 재확인 필요라고 적는다.